name: DPIA-as-Code Compliance Gate

on:
  pull_request:
    paths:
      - "examples/**"
      - "rules/**"
      - "schemas/**"
      - "src/**"
      - "tests/**"
      - "**/*dataflow*.yaml"
      - "**/*dataflow*.yml"
      - ".github/workflows/dpia-gate.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_file:
        description: "Path to dataflow.yaml to assess"
        required: false
        default: "examples/banking_retail_credit_ai.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  unit-tests-and-schema:
    name: Unit Tests & Schema Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (with web & dev extras)
        run: pip install -e ".[web,dev]"

      - name: Run full unit test suite (Models, Rules, Engines, CLI)
        run: python -m unittest discover -s tests -v

  dpia-pr-gate:
    name: DPIA / PIA / FRIA Gate & PR Comment
    needs: unit-tests-and-schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DPIA-as-Code CLI
        run: pip install -e .

      - name: Select target dataflow specification
        id: select
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.target_file }}" ]; then
            echo "target=${{ github.event.inputs.target_file }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=examples/banking_retail_credit_ai.yaml" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate dataflow.yaml schema
        run: dpia validate "${{ steps.select.outputs.target }}"

      - name: Generate audit Markdown report & PR summary
        id: assess
        shell: bash
        run: |
          set +e
          dpia assess "${{ steps.select.outputs.target }}" --format md --output artifacts/dpia_audit_report.md
          GATE_EXIT=$?
          dpia assess "${{ steps.select.outputs.target }}" --format pr-comment --no-fail --output artifacts/pr_comment.md
          dpia assess "${{ steps.select.outputs.target }}" --format json --no-fail --output artifacts/dpia_report.json
          echo "gate_exit=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload DPIA Audit Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dpia-audit-report
          path: artifacts/
          retention-days: 90

      - name: Post or update PR risk summary comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- dpia-as-code-pr-comment -->';
            const summary = fs.readFileSync('artifacts/pr_comment.md', 'utf8');
            const body = `${marker}\n${summary}\n\n> 📎 完整审计版 DPIA/PIA/FRIA 报告及 JSON 证据已上传至本次 Workflow Run 的 \`dpia-audit-report\` Artifact。`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce CI/CD Merge Gate
        shell: bash
        run: |
          if [ "${{ steps.assess.outputs.gate_exit }}" != "0" ]; then
            echo "::error::DPIA-as-Code Gate BLOCKED merge (exit code ${{ steps.assess.outputs.gate_exit }}). Review the PR comment or dpia-audit-report artifact."
            exit "${{ steps.assess.outputs.gate_exit }}"
          fi
