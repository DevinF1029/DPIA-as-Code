# yaml-language-server: $schema=../schemas/dataflow.schema.json
schema_version: "1.0"

metadata:
  system_id: bank-retail-ai-credit
  name: 商业银行零售智能信贷审批与风控系统 (Banking AI Credit Underwriting)
  description: >
    商业银行零售信贷线上审批链路：采集客户身份与个人金融征信数据，通过本地部署的
    AI 信用评分大模型辅助授信决策，配备人工复核通道、国密 SM4 静态加密与分级管控，
    展示通用数据安全 GRC 骨架与金融行业预留字段（banking / CIIO / JR/T 0197）的协同落地。
  controller: 示例商业银行股份有限公司（总行零售金融总部）
  dpo_contact: cco-privacy@example-bank.cn
  jurisdictions:
    - PIPL
    - CN_DSL_NDSR
    - EU_AI_ACT
  home_region: CN
  data_subjects:
    - customers
  estimated_subjects: 2500000
  is_ciio: true
  industry_sector: banking
  ai_system:
    is_ai_system: true
    risk_tier: high_risk
    prohibited_practices: []
    transparency_notice: true
    model_card_ref: docs/model_cards/retail_credit_llm_v3.md
  dpo_signoff:
    approved: true
    reviewer: 法律合规部 / 首席合规官办公室
    reviewed_at: "2026-11-15"
    ticket: COMP-PIA-2026-088

data_assets:
  - id: customer_id_biometric
    name: 客户身份核验与活体特征摘要
    categories:
      - basic_identity
      - government_id
      - biometric
    identifiability: pseudonymized
    data_classification: important
    financial_data_level: L4
    description: 脱敏化身份证件核验结果与活体特征向量（非原始高清人脸照）。

  - id: credit_bureau_report
    name: 个人征信与金融账户流水画像
    categories:
      - financial_account
    identifiability: directly_identifiable
    data_classification: important
    financial_data_level: L4
    description: 经客户单独授权查询的央行征信摘要与行内账户流水指标。

entities:
  - id: retail_applicant
    name: 零售信贷申请客户（手机银行 App）
    role: data_subject
    region: CN
    trust_boundary: public_internet
    notice_provided: true
    opt_out_available: true

  - id: licensed_credit_bureau
    name: 持牌个人征信机构（境内）
    role: third_party_controller
    region: CN
    trust_boundary: licensed_financial_network
    dpa_signed: true

processes:
  - id: credit_intake_gateway
    name: 零售信贷进件与单独同意网关
    operations:
      - collection
      - biometric_identification
    purposes:
      - 客户身份核验（KYC）与征信查询单独授权存证
    lawful_basis: separate_consent
    trust_boundary: bank_dmz
    innovative_technology: true

  - id: ai_underwriting_engine
    name: 智能信贷审批与风控评分引擎（含人工复核）
    operations:
      - scoring
      - automated_decision_making
      - dataset_matching
    purposes:
      - 零售贷款额度测算与反欺诈风控审批
    lawful_basis: separate_consent
    trust_boundary: bank_core_zone
    innovative_technology: true
    prevents_rights_or_service: true
    human_review_available: true

stores:
  - id: credit_core_db
    name: 信贷风控核心库（国密 SM4 + 审计 WORM）
    technology: OceanBase
    trust_boundary: bank_data_tier
    data:
      - customer_id_biometric
      - credit_bureau_report
    encrypted_at_rest: true
    retention_days: 1825
    access_control: RBAC_JIT_DUAL_APPROVAL
    audit_logging: true

flows:
  - id: flow_app_to_intake
    name: 客户提交授信申请与单独授权
    source: retail_applicant
    target: credit_intake_gateway
    data:
      - customer_id_biometric
    protocol: HTTPS/TLS 1.3
    encrypted_in_transit: true

  - id: flow_bureau_to_engine
    name: 专线拉取授权征信报告
    source: licensed_credit_bureau
    target: ai_underwriting_engine
    data:
      - credit_bureau_report
    protocol: Financial_Dedicated_Line/mTLS
    encrypted_in_transit: true

  - id: flow_intake_to_engine
    name: 触发智能授信评分
    source: credit_intake_gateway
    target: ai_underwriting_engine
    data:
      - customer_id_biometric
    protocol: gRPC/mTLS
    encrypted_in_transit: true

  - id: flow_engine_to_core_db
    name: 持久化审批结果与合规留档
    source: ai_underwriting_engine
    target: credit_core_db
    data:
      - customer_id_biometric
      - credit_bureau_report
    protocol: JDBC/TLS 1.3
    encrypted_in_transit: true

mitigations:
  - id: mit_sm4_kms
    control_id: PC-ENC-02
    pet_type: encryption_at_rest
    description: 核心库采用国密 SM4 透明加密与独立 HSM 密钥管理，通过年度密评。
    applies_to:
      - credit_core_db
    status: verified
    evidence: audit/sm4-gm-assessment-2026.pdf
    owner: bank-infosec

  - id: mit_pseudo_bio
    control_id: PC-ENC-03
    pet_type: pseudonymization
    description: 生物特征模板采用不可逆加盐令牌化，映射表独立隔离存储。
    applies_to:
      - credit_intake_gateway
      - ai_underwriting_engine
    status: verified
    evidence: https://git.example-bank.cn/credit/pull/1024
    owner: privacy-eng

  - id: mit_human_oversight
    control_id: PC-AI-01
    pet_type: human_in_the_loop
    description: 拒贷与降额决策提供 7x24 人工复核申诉入口与风控官一键中止开关。
    applies_to:
      - ai_underwriting_engine
    status: verified
    evidence: docs/sop/credit_human_override_drill_2026.md
    owner: retail-risk-ops

  - id: mit_minimization_engine
    control_id: PC-DAT-01
    pet_type: data_minimization
    description: 特征工程仅提取必要授信衍生指标，原始明细不进入评分特征集。
    applies_to:
      - ai_underwriting_engine
    status: verified
    evidence: https://git.example-bank.cn/credit/pull/1089
    owner: risk-ml-team
